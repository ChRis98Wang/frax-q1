name: CPU tests and source release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[visualization,test]'
      - run: python -m pytest -q -m 'not integration'
      - run: python tools/check_release.py --tracked
      - name: Lightweight CLI help
        run: |
          q1-frax-setup --help
          q1-frax-retarget --help
          q1-frax-play --help
          q1-frax-render --help
          q1-frax-quality --help
          q1-frax-seal --help
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
