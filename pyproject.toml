[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q1-frax"
version = "0.1.1"
description = "Primebot Q1 LAFAN motion retargeting with FRAX, physical quality checks, and collision visualization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "mujoco>=3.3.1,<5", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/ChRis98Wang/frax-q1"
Issues = "https://github.com/ChRis98Wang/frax-q1/issues"

[project.optional-dependencies]
retarget = ["frax[ik] @ git+https://github.com/StanfordASL/frax.git@f5e87ab59a0b82ba43095e882c1b88c9b0dacf07"]
cuda13 = ["jax[cuda13]>=0.9.1"]
visualization = ["pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
test = ["pytest>=8"]

[project.scripts]
q1-frax-setup = "q1_frax.setup_assets:main"
q1-frax-retarget = "q1_frax.retarget:main"
q1-frax-play = "q1_frax.play:main"
q1-frax-render = "q1_frax.render:main"
q1-frax-quality = "q1_frax.quality:main"
q1-frax-seal = "q1_frax.seal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly prepared pinned upstream assets"]
